services:
  whatsapp-bridge:
    image: ghcr.io/suckerfish/whatsapp-mcp-bridge:latest
    pull_policy: always
    restart: unless-stopped
    volumes:
      - /mnt/user/appdata/whatsapp-mcp:/app/store
    environment:
      WHATSAPP_BRIDGE_PORT: "8080"
      WHATSAPP_BRIDGE_BIND: "0.0.0.0"
      WHATSAPP_BRIDGE_ALLOWED_HOSTS: "whatsapp-bridge:8080"
      HEALTHCHECKS_PING_URL: ""  # e.g. https://hc-ping.com/<uuid> — ping on each successful health check

    # ── Full history re-pair ──────────────────────────────────────────────────
    # To pull complete message history from your phone:
    #   1. Stop the stack
    #   2. Delete /mnt/user/appdata/whatsapp-mcp/whatsapp.db
    #   3. Uncomment the `command` line below
    #   4. Start the stack and scan the QR code
    #   5. Wait for history sync to finish (watch: docker logs -f whatsapp-bridge)
    #   6. Re-comment `command` and restart normally
    #
    # command: ["--full-history-pair"]
    # ─────────────────────────────────────────────────────────────────────────

    healthcheck:
      test:
        - CMD-SHELL
        - |
          TOKEN=$(cat /app/store/.bridge-token 2>/dev/null | tr -d '\n') &&
          wget -qO- --header="Authorization: Bearer $TOKEN"
          http://localhost:8080/api/health | grep -q '"connected":true' &&
          { [ -z "$HEALTHCHECKS_PING_URL" ] || wget -qO- "$HEALTHCHECKS_PING_URL" > /dev/null; }
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - whatsapp-internal

  whatsapp-mcp-server:
    image: ghcr.io/suckerfish/whatsapp-mcp-server:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - /mnt/user/appdata/whatsapp-mcp:/app/store
    environment:
      WHATSAPP_API_URL: "http://whatsapp-bridge:8080/api"
      WHATSAPP_BRIDGE_TOKEN: ""  # paste token from store/.bridge-token after first bridge start
      WHATSAPP_DB_PATH: "/app/store/messages.db"
      WHATSMEOW_DB_PATH: "/app/store/whatsapp.db"
      MCP_TRANSPORT: "http"
      MCP_PORT: "8765"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.connect(('localhost', 8765)); s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - whatsapp-bridge
    networks:
      - whatsapp-internal

networks:
  whatsapp-internal:
    driver: bridge
