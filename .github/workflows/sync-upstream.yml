name: Sync from upstream

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # SYNC_TOKEN is a PAT with `repo` + `workflow` scope. The default
          # GITHUB_TOKEN cannot push commits that touch .github/workflows/,
          # so upstream workflow changes fail the push without it.
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/verygoodplugins/whatsapp-mcp.git

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Attempt merge
        id: merge
        run: |
          if git merge upstream/main --no-edit; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - name: Push if merged cleanly
        if: steps.merge.outputs.merged == 'true'
        run: |
          if git push origin main 2>push.log; then
            cat push.log
            exit 0
          fi
          cat push.log
          if grep -q "without \`workflows\` permission" push.log; then
            {
              echo "### Upstream sync blocked"
              echo "Upstream changed a file in \`.github/workflows/\`."
              echo "The default \`GITHUB_TOKEN\` cannot push workflow changes."
              echo "Add a PAT with \`repo\` + \`workflow\` scope as the \`SYNC_TOKEN\` secret,"
              echo "or sync manually:"
              echo '```'
              echo "git fetch upstream main && git merge upstream/main && git push origin main"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Push rejected: workflow files changed and SYNC_TOKEN is not set."
          fi
          exit 1

      - name: Report conflict
        if: steps.merge.outputs.merged == 'false'
        run: |
          {
            echo "### Upstream sync conflict"
            echo "Resolve manually:"
            echo '```'
            echo "git fetch upstream main"
            echo "git merge upstream/main"
            echo "# fix conflicts"
            echo "git push origin main"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Upstream sync hit a merge conflict — manual resolution needed."
          exit 1
