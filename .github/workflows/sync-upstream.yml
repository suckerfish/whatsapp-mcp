name: Sync from upstream

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # GITHUB_TOKEN cannot push commits that touch .github/workflows/.
          # Those syncs are done manually — see the "Push if merged cleanly" step.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/verygoodplugins/whatsapp-mcp.git

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Attempt merge
        id: merge
        run: |
          if git merge upstream/main --no-edit; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - name: Push if merged cleanly
        if: steps.merge.outputs.merged == 'true'
        run: |
          if git push origin main 2>push.log; then
            cat push.log
            exit 0
          fi
          cat push.log
          if grep -q "without \`workflows\` permission" push.log; then
            {
              echo "### Upstream sync needs a manual push"
              echo "Upstream changed a file in \`.github/workflows/\`."
              echo "\`GITHUB_TOKEN\` cannot push workflow changes. Sync locally:"
              echo '```'
              echo "git fetch upstream main && git merge upstream/main && git push origin main"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Push rejected: upstream changed workflow files — sync manually."
          fi
          exit 1

      - name: Report conflict
        if: steps.merge.outputs.merged == 'false'
        run: |
          {
            echo "### Upstream sync conflict"
            echo "Resolve manually:"
            echo '```'
            echo "git fetch upstream main"
            echo "git merge upstream/main"
            echo "# fix conflicts"
            echo "git push origin main"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Upstream sync hit a merge conflict — manual resolution needed."
          exit 1
