name: Build and push Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BRIDGE_IMAGE: ghcr.io/suckerfish/whatsapp-mcp-bridge
  SERVER_IMAGE: ghcr.io/suckerfish/whatsapp-mcp-server

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push bridge image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/bridge/Dockerfile
          push: true
          tags: |
            ${{ env.BRIDGE_IMAGE }}:latest
            ${{ env.BRIDGE_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=bridge
          cache-to: type=gha,mode=max,scope=bridge

      - name: Build and push MCP server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/mcp-server/Dockerfile
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:latest
            ${{ env.SERVER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=mcp-server
          cache-to: type=gha,mode=max,scope=mcp-server
